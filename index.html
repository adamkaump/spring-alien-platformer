<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game Test 1</title>
  <style>
    /* Center the game on the page and give it a nice background. */
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      color: white;
    }
    h1 { margin: 16px 0 8px; }
    p  { margin: 0 0 12px; opacity: 0.7; }
    /* The canvas is where the whole game is drawn. */
    canvas {
      background: #87ceeb; /* sky blue */
      border: 4px solid #16213e;
      border-radius: 8px;
    }
    /* The timer shown beneath the game. */
    #timer {
      margin-top: 12px;
      font-size: 22px;
      font-variant-numeric: tabular-nums; /* keeps digits from jiggling */
      letter-spacing: 1px;
    }
    /* The best (fastest) finish time. */
    #best {
      margin-top: 4px;
      font-size: 16px;
      color: #ffd700; /* gold */
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    /* The Start / Restart buttons under the timer. */
    #timer-controls {
      margin-top: 8px;
      display: flex;
      gap: 10px;
    }
    #timer-controls button {
      font-size: 16px;
      padding: 6px 18px;
      border: none;
      border-radius: 6px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
    }
    #timer-controls button:hover { background: #ff5c78; }
  </style>
</head>
<body>
  <h1>Game Test 1</h1>
  <p>Arrow keys or A / D to move &nbsp;•&nbsp; Space or Up to jump &nbsp;•&nbsp; F to throw a bomb</p>
  <canvas id="game" width="800" height="450"></canvas>
  <div id="timer">Time: 0:00</div>
  <div id="best">Best: --</div>
  <div id="timer-controls">
    <button id="restartBtn">Restart</button>
  </div>

  <script>
  // ============================================================
  //  SETUP
  // ============================================================
  // Grab the canvas and its "2d context" — the thing we draw with.
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ============================================================
  //  THE WORLD
  // ============================================================
  // Gravity pulls the player down a little more each frame.
  const GRAVITY = 0.6;
  // How fast the player moves left/right.
  const MOVE_SPEED = 4;
  // How much upward "oomph" a jump has. Bigger = higher jump.
  const JUMP_STRENGTH = 19;
  // How long a rickety platform wobbles before it drops (in frames).
  const FALL_DELAY = 18;
  // How long a moving platform pauses at each end (in frames, ~60 = 1 sec).
  const PLATFORM_PAUSE = 60;

  // The player is just a rectangle for now. x/y is its top-left corner.
  // vx/vy are its velocity (how far it moves each frame).
  const player = {
    x: 100,
    y: 100,
    width: 32,
    height: 48,
    vx: 0,
    vy: 0,
    onGround: false,
    color: "#e94560",
    facing: 1, // 1 = looking right, -1 = looking left (for throwing)
    bombs: 0,  // how many bombs the player is carrying
  };

  // ============================================================
  //  THE CHARACTER SPRITE  ← Connor's drawing board!
  // ============================================================
  // Each letter below is one pixel of the character. Change the
  // letters to redraw him, then refresh the browser to see it.
  //   .  = see-through (nothing)          W = eye white
  //   A  = antenna tip (glow)             E = eye pupil
  //   G  = green alien skin               P = spring metal
  // Want a new color? Add it to SPRITE_COLORS, then use its letter.
  const SPRITE_COLORS = {
    A: "#ff5ce1", // glowing antenna tips
    G: "#5ad63a", // alien green skin
    W: "#ffffff", // eye whites
    E: "#1a1a1a", // eye pupils
    P: "#b0b0b0", // springy metal coil
  };

  // The alien's head & body (edit his face here, just once).
  const BODY = [
    "..A..A..", // antenna tips
    "..G..G..", // antenna stalks
    ".GGGGGG.", // top of head
    "GGGGGGGG", // head
    "GWWGGWWG", // big eyes (whites)
    "GWEGGEWG", // eyes looking forward (pupils)
    "GGGGGGGG", // cheeks
    ".GGGGGG.", // little body
  ];

  // Two different springs for the bottom of the alien.
  const SPRING_COILED = [
    ".PPPPPP.", // all coiled up (used while standing)
    ".P......",
    ".PPPPPP.",
    "......P.",
    ".PPPPPP."
  ];
  const SPRING_STRETCHED = [
    "..PP....", // sprung open into a zig-zag (used while jumping)
    "....PP..",
    "..PP....",
    "....PP..",
  ];

  // Glue the body to each spring to make the two full poses.
  const SPRITE_COILED = BODY.concat(SPRING_COILED);
  const SPRITE_STRETCHED = BODY.concat(SPRING_STRETCHED);

  // ============================================================
  //  THE ENEMY SPRITE (a rounded purple alien, drawn in pixels)
  // ============================================================
  //   P = purple body   D = dark purple (feet)   A = antenna glow
  //   W = eye white      E = eye pupil            M = mouth
  const ENEMY_COLORS = {
    P: "#9b3ff2",
    D: "#7a25c9",
    A: "#e05cff",
    W: "#ffffff",
    E: "#1a1a1a",
    M: "#4a1a7a",
  };
  const ENEMY_SPRITE = [
    "..A...A..", // antenna tips
    "..P...P..", // antenna stalks
    "..PPPPP..", // rounded head top
    ".PPPPPPP.",
    "PPPPPPPPP", // widest part of the body
    "PWWPPPWWP", // eyes (whites)
    "PWEPPPEWP", // eyes (pupils)
    ".PPMMMPP.", // rounded chin + mouth
    "..D...D..", // little feet
  ];

  // ============================================================
  //  THE SLIME BOSS SPRITE (a big green blob monster)
  // ============================================================
  //   S = slime green   D = dark slime (mouth)   W = eye white   E = pupil
  const SLIME_COLORS = {
    S: "#6ab04c",
    D: "#33501f",
    W: "#ffffff",
    E: "#1a1a1a",
  };
  const SLIME_SPRITE = [
    "...SSSSS...", // rounded top of the blob
    "..SSSSSSS..",
    ".SSSSSSSSS.",
    "SSSSSSSSSSS",
    "SWWSSSSSWWS", // big eyes (whites)
    "SWESSSSSEWS", // pupils
    "SSSSSSSSSSS",
    "SSSDDDDDSSS", // gooey mouth
    "SSSSSSSSSSS", // flat bottom, sitting on the ground
  ];

  // A little slime ball the boss shoots.  S = green, D = dark edge, L = shine
  const SLIMEBALL_COLORS = {
    S: "#6ab04c",
    D: "#33501f",
    L: "#9bd66f",
  };
  const SLIMEBALL_SPRITE = [
    ".DDDD.",
    "DSSSSD",
    "DLSSSD", // L = shiny spot
    "DSSSSD",
    "DSSSSD",
    ".DDDD.",
  ];

  // ============================================================
  //  THE GOAL FLAG SPRITE (a pixel pennant on a pole)
  // ============================================================
  //   O = pole (brown)    R = flag (red)    . = see-through
  const FLAG_COLORS = {
    O: "#8b5a2b",
    R: "#e94560",
  };
  const FLAG_SPRITE = [
    "ORRRRRR", // flag: full width at the top...
    "ORRRRRR",
    "ORRRRR.",
    "ORRRR..", // ...then tapering to a point
    "ORRR...",
    "ORR....",
    "OR.....",
    "O......", // the pole runs down the rest
    "O......",
    "O......",
    "O......",
    "O......",
    "O......",
    "O......",
    "O......",
    "O......",
  ];

  // ============================================================
  //  THE BOMB SPRITE (a round bomb with a lit fuse, in pixels)
  // ============================================================
  //   K = black body   H = highlight   F = fuse   S = spark   . = clear
  const BOMB_COLORS = {
    K: "#222831",
    H: "#5a6472",
    F: "#a56b2b",
    S: "#ffcf33",
  };
  const BOMB_SPRITE = [
    ".....S..", // sparky tip
    "....F...", // fuse
    "...KK...", // top of the round body
    "..KKKK..",
    "..HKKK..", // H = shiny highlight
    "..KKKK..",
    "...KK...", // bottom of the body
  ];

  // ============================================================
  //  LEVELS
  // ============================================================
  // The game is a list of levels. Each level says where the player
  // starts, which platforms exist, and where the GOAL (flag) is.
  // Reach the goal to move on to the next level!
  const levels = [
    {
      start: { x: 100, y: 100 },
      platforms: [
        { x: 0,   y: 410, width: 800, height: 40 }, // ground
        { x: 150, y: 320, width: 140, height: 20 },
        { x: 380, y: 250, width: 140, height: 20 },
      ],
      goal: { x: 600, y: 180, width: 140, height: 20 },
    },
    {
      // Level 2: nothing but the ground and a high goal at the far end —
      // run across, then clear it in one big jump!
      start: { x: 80, y: 300 },
      platforms: [
        { x: 0, y: 410, width: 800, height: 40 }, // ground
      ],
      goal: { x: 610, y: 200, width: 150, height: 20 },
    },
    {
      // Level 3: the floor is LAVA! Hop across the platforms to survive.
      start: { x: 50, y: 280 },
      platforms: [
        { x: 20,  y: 370, width: 130, height: 20 }, // safe starting ledge
        { x: 230, y: 330, width: 110, height: 20 }, // stepping stones...
        { x: 420, y: 300, width: 110, height: 20 },
      ],
      goal: { x: 620, y: 270, width: 130, height: 20 },
      lava: { x: 0, y: 420, width: 800, height: 30 }, // deadly floor
    },
    {
      // Level 4: a brick wall blocks the path from floor to ceiling — you
      // can't jump over it. Grab the bomb, walk up to the wall, and press
      // F to throw it and blast a hole through!
      start: { x: 40, y: 300 },
      platforms: [
        { x: 0, y: 410, width: 800, height: 40 },              // ground
        { x: 420, y: 0, width: 40, height: 410, brick: true }, // the wall
      ],
      items: [
        { x: 200, y: 390, width: 20, height: 20, type: "bomb" }, // pick me up!
      ],
      goal: { x: 680, y: 360, width: 110, height: 20 },
    },
    {
      // Level 5: a purple alien paces back and forth — jump over it!
      start: { x: 60, y: 300 },
      platforms: [
        { x: 0, y: 410, width: 800, height: 40 }, // ground
      ],
      enemies: [
        // Walks between minX and maxX, turning around at each end.
        { x: 300, y: 376, width: 34, height: 34,
          speed: 1.8, dir: 1, minX: 230, maxX: 560 },
      ],
      goal: { x: 660, y: 350, width: 120, height: 20 },
    },
    {
      // Level 6: the goal is too far to jump to — ride the moving
      // platform across the lava to reach it!
      start: { x: 40, y: 300 },
      platforms: [
        { x: 20, y: 360, width: 140, height: 20 }, // safe start ledge
        // The moving ferry. It slides along its axis between min and max.
        { x: 160, y: 360, width: 90, height: 20,
          move: true, axis: "x", speed: 3, dir: 1, min: 160, max: 520 },
      ],
      goal: { x: 640, y: 330, width: 130, height: 20 },
      lava: { x: 0, y: 420, width: 800, height: 30 },
    },
    {
      // Level 7: the middle platform is rickety! Step on it and it drops
      // into the lava, so you must hop across it fast (or leap the gap).
      start: { x: 50, y: 280 },
      platforms: [
        { x: 20,  y: 360, width: 120, height: 20 },              // safe start
        { x: 300, y: 360, width: 130, height: 20, falls: true }, // RICKETY!
      ],
      goal: { x: 630, y: 340, width: 130, height: 20 },
      lava: { x: 0, y: 420, width: 800, height: 30 },
    },
    {
      // Level 8: BOSS FIGHT! A slime monster shoots deadly slime balls.
      // Ride the lift up to grab a bomb, then throw it at the slime to
      // destroy it. (No goal flag — killing the slime wins the level.)
      start: { x: 40, y: 300 },
      platforms: [
        { x: 0, y: 410, width: 800, height: 40 }, // ground
        // A lift: a platform that rides up and down (axis "y").
        { x: 110, y: 360, width: 70, height: 16,
          move: true, axis: "y", speed: 2, dir: -1, min: 170, max: 360 },
        { x: 200, y: 180, width: 170, height: 16 }, // high platform (bomb up here)
      ],
      items: [
        { x: 270, y: 160, width: 20, height: 20, type: "bomb" }, // reachable via the lift
      ],
      boss: {
        x: 660, y: 300, width: 100, height: 110,
        shootInterval: 100, // frames between slime-ball shots
      },
    },
  ];

  // Which level we're on, and whether the whole game has been won.
  let currentLevel = 0;
  let gameWon = false;
  let onHomeScreen = true; // show the title screen until Start is clicked
  // Which mode we're playing:
  //   "normal"    dying respawns at the current level
  //   "hard"      dying sends you to Level 1 and resets the timer
  //   "superhard" dying sends you to Level 1 but the timer keeps running
  let mode = "normal";

  // Buttons (each an x, y, width, height rectangle): three on the home
  // screen, and Restart on the win screen.
  const START_BTN = { x: 280, y: 210, width: 240, height: 42 };
  const HARDCORE_BTN = { x: 280, y: 258, width: 240, height: 42 };
  const SUPER_BTN = { x: 280, y: 306, width: 240, height: 42 };
  const RESET_SCORE_BTN = { x: 280, y: 360, width: 240, height: 38 };
  const RESTART_BTN = { x: 300, y: 250, width: 200, height: 56 };

  // Timer shown beneath the game, controlled by the Start / Restart buttons.
  const timerEl = document.getElementById("timer");
  let timerRunning = false; // is the timer counting right now?
  let elapsedMs = 0;        // how much time has been counted so far
  let startTime = 0;        // performance.now() that lines up with elapsed = 0

  // Best (fastest) finish times, kept separately for normal and hardcore
  // modes. loadBest() reads them from the browser's storage so they're
  // remembered even after you close the page.
  const bestEl = document.getElementById("best");
  let bestNormalMs = loadBest("bestTimeMs_v2");
  let bestHardMs = loadBest("bestTimeHardMs_v2");
  let bestSuperMs = loadBest("bestTimeSuperMs_v2");
  let prevGameWon = false; // was the game already won last frame?

  // These hold the platforms/goal/lava for the level we're playing now.
  // loadLevel() fills them in.
  let platforms = [];
  let goal = null;    // most levels have a goal flag; a boss level may not
  let lava = null;    // some levels have a lava floor; others don't
  let enemies = [];   // some levels have walking enemies; others don't
  let boss = null;      // a boss monster (the slime), if this level has one
  let slimeBalls = [];  // slime balls the boss is currently shooting
  let brickBits = [];   // falling pieces from a crumbling brick wall
  let items = [];       // pickups sitting in the level (like bombs)
  let thrownBombs = []; // bombs currently flying through the air
  let prevThrow = false; // was the throw key down last frame? (one throw per press)
  let tick = 0;       // counts frames, used to animate the lava

  // Set up a level: place the player at the start and load its platforms.
  function loadLevel(index) {
    const level = levels[index];
    // Copy each platform so we can safely change one (like a falling
    // platform) without permanently altering the level for next time.
    platforms = level.platforms.map((p) => ({ ...p }));
    goal = level.goal || null; // boss levels may have no flag
    lava = level.lava || null; // no lava on this level? then null.
    // Copy enemies too, so their positions reset when you respawn.
    enemies = (level.enemies || []).map((e) => ({ ...e }));
    // Fresh copy of the boss (if any), and clear its slime balls.
    boss = level.boss ? { ...level.boss } : null;
    slimeBalls = [];
    brickBits = []; // clear any leftover crumbling-wall pieces
    // Fresh copies of the pickups, and clear any bombs / carried items.
    items = (level.items || []).map((it) => ({ ...it }));
    thrownBombs = [];
    player.bombs = 0;
    player.facing = 1;
    player.x = level.start.x;
    player.y = level.start.y;
    player.vx = 0;
    player.vy = 0;
  }

  loadLevel(currentLevel); // start on the first level

  // Start the whole game over from Level 1 (used by the Restart button).
  function restartGame() {
    currentLevel = 0;
    gameWon = false;
    restartTimer(); // reset the timer to 0:00, paused until Start is pressed
    loadLevel(0);
  }

  // Finish the current level: move to the next one, or win if it's the last.
  // Reaching a goal flag OR destroying the slime boss both call this.
  function completeLevel() {
    if (currentLevel < levels.length - 1) {
      currentLevel++;
      loadLevel(currentLevel);
    } else {
      gameWon = true; // that was the last level — you win!
    }
  }

  // Leave the title screen and begin a fresh game in the chosen mode
  // ("normal", "hard", or "superhard").
  function startGame(chosenMode) {
    mode = chosenMode;
    onHomeScreen = false;
    restartGame(); // start clean: Level 1, timer at 0:00
  }

  // The player died. What that means depends on the mode:
  //   normal    -> respawn at the start of the current level
  //   hard      -> back to Level 1, AND the timer resets
  //   superhard -> back to Level 1, but the timer keeps running (brutal!)
  function die() {
    if (mode === "normal") {
      loadLevel(currentLevel);
      return;
    }
    currentLevel = 0;
    if (mode === "hard") restartTimer(); // hard wipes the clock; superhard doesn't
    loadLevel(0);                        // teleport back to the first level
  }

  // ============================================================
  //  KEYBOARD INPUT
  // ============================================================
  // We remember which keys are currently held down.
  const keys = {};
  document.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    // Stop the page from scrolling when using arrows / space.
    if (["ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  });
  document.addEventListener("keyup", (e) => {
    keys[e.code] = false;
  });

  // --- Secret level warp: tap "a", then a number (1-9), to jump levels ---
  // We remember when "a" was just pressed. If the next key is a number,
  // we treat it as a warp code instead of normal typing.
  let warpArmed = false;
  document.addEventListener("keydown", (e) => {
    if (e.code === "KeyA") {
      warpArmed = true; // "a" starts the combo (it still moves left too)
    } else if (warpArmed && e.key >= "1" && e.key <= "9") {
      const index = Number(e.key) - 1; // "1" is the first level
      if (index < levels.length) {
        currentLevel = index;
        gameWon = false;       // in case we'd already won
        loadLevel(currentLevel);
      }
      warpArmed = false;
    } else {
      warpArmed = false; // any other key cancels the combo
    }
  });

  // ============================================================
  //  MOUSE INPUT
  // ============================================================
  // Turn a mouse event into a position on the game canvas (the canvas
  // might be displayed at a different size than its 800x450 drawing area,
  // so we scale the coordinates to match).
  function mousePos(ev) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) * (canvas.width / r.width),
      y: (ev.clientY - r.top) * (canvas.height / r.height),
    };
  }
  // Is the mouse currently over the given button rectangle b?
  function overButton(ev, b) {
    const m = mousePos(ev);
    return (
      m.x >= b.x && m.x <= b.x + b.width &&
      m.y >= b.y && m.y <= b.y + b.height
    );
  }
  // Clicking a button: Start on the home screen, Restart on the win screen.
  canvas.addEventListener("click", (ev) => {
    if (onHomeScreen) {
      if (overButton(ev, START_BTN)) startGame("normal");
      else if (overButton(ev, HARDCORE_BTN)) startGame("hard");
      else if (overButton(ev, SUPER_BTN)) startGame("superhard");
      else if (overButton(ev, RESET_SCORE_BTN)) resetHighScores();
    } else if (gameWon && overButton(ev, RESTART_BTN)) {
      restartGame();
    }
  });
  // Show a pointer cursor when hovering whichever button is on screen.
  canvas.addEventListener("mousemove", (ev) => {
    const overHome =
      onHomeScreen &&
      (overButton(ev, START_BTN) ||
        overButton(ev, HARDCORE_BTN) ||
        overButton(ev, SUPER_BTN) ||
        overButton(ev, RESET_SCORE_BTN));
    const overRestart = gameWon && overButton(ev, RESTART_BTN);
    canvas.style.cursor = overHome || overRestart ? "pointer" : "default";
  });

  // ============================================================
  //  HELPERS
  // ============================================================
  // Returns true if two rectangles are touching/overlapping.
  // We reuse this for both landing on platforms and reaching the goal.
  function rectsOverlap(a, b) {
    return (
      a.x < b.x + b.width &&
      a.x + a.width > b.x &&
      a.y < b.y + b.height &&
      a.y + a.height > b.y
    );
  }

  // True if the player is resting on top of platform p (feet on its
  // surface and horizontally overlapping). Used to "ride" moving platforms.
  function isStandingOn(p) {
    return (
      player.x < p.x + p.width &&
      player.x + player.width > p.x &&
      Math.abs((player.y + player.height) - p.y) <= 2
    );
  }

  // ============================================================
  //  UPDATE — runs every frame to move things
  // ============================================================
  function update() {
    // Freeze the action while on the title screen or after winning.
    if (onHomeScreen || gameWon) return;
    // --- Left / right movement ---
    if (keys["ArrowLeft"] || keys["KeyA"]) {
      player.vx = -MOVE_SPEED;
      player.facing = -1; // now looking left
    } else if (keys["ArrowRight"] || keys["KeyD"]) {
      player.vx = MOVE_SPEED;
      player.facing = 1; // now looking right
    } else {
      player.vx = 0; // no key held = stop
    }

    // --- Jumping ---
    // Only allow a jump if the player is standing on something.
    const jumpPressed = keys["Space"] || keys["ArrowUp"] || keys["KeyW"];
    if (jumpPressed && player.onGround) {
      player.vy = -JUMP_STRENGTH; // negative = upward
      player.onGround = false;
    }

    // --- Throwing a bomb (press F), but only if we're carrying one ---
    // We only throw on the frame the key goes DOWN, so holding F doesn't
    // spray a stream of bombs.
    const throwPressed = keys["KeyF"];
    if (throwPressed && !prevThrow && player.bombs > 0) {
      player.bombs--;
      thrownBombs.push({
        x: player.x + player.width / 2 - 8,
        y: player.y + player.height / 2 - 8,
        width: 16,
        height: 16,
        vx: 8 * player.facing, // flies the way the player is looking
        vy: -8,                 // tossed upward so it arcs (gravity pulls it down)
      });
    }
    prevThrow = throwPressed;

    // --- Start the timer the moment the player first moves ---
    // (startTimer does nothing if the timer is already running.)
    if (
      keys["ArrowLeft"] || keys["KeyA"] || keys["ArrowRight"] || keys["KeyD"] ||
      keys["Space"] || keys["ArrowUp"] || keys["KeyW"]
    ) {
      startTimer();
    }

    // --- Gravity ---
    player.vy += GRAVITY;

    // --- Rickety platforms: once stepped on, wobble then plummet ---
    for (const p of platforms) {
      if (p.falls && p.triggered) {
        p.fallTimer = (p.fallTimer || 0) + 1;
        if (p.fallTimer > FALL_DELAY) {
          p.vy = (p.vy || 0) + GRAVITY; // start falling, faster each frame
          p.y += p.vy;
        }
      }
    }

    // --- Moving platforms: slide back and forth, carrying any rider ---
    // Super hardcore makes them move twice as fast with NO pause at the ends.
    const superFast = mode === "superhard";
    for (const p of platforms) {
      if (!p.move) continue;

      // Pausing at an end? Count down and stay still this frame.
      if (p.wait > 0) { p.wait--; continue; }

      const speed = p.speed * (superFast ? 2 : 1);
      const pos = p.axis === "x" ? p.x : p.y;   // position along its track
      let next = pos + speed * p.dir;
      // Reached an end: clamp there, turn around, and pause (unless super).
      if (next <= p.min) { next = p.min; p.dir = 1;  if (!superFast) p.wait = PLATFORM_PAUSE; }
      if (next >= p.max) { next = p.max; p.dir = -1; if (!superFast) p.wait = PLATFORM_PAUSE; }
      const delta = next - pos;
      const dx = p.axis === "x" ? delta : 0;
      const dy = p.axis === "y" ? delta : 0;
      // If the player is riding on top, move them along with the platform.
      if (isStandingOn(p)) { player.x += dx; player.y += dy; }
      p.x += dx;
      p.y += dy;
    }

    // --- Thrown bombs arc through the air and blow up brick walls ---
    for (let i = thrownBombs.length - 1; i >= 0; i--) {
      const b = thrownBombs[i];
      b.vy += GRAVITY; // gravity pulls it down each frame, making an arc
      b.x += b.vx;
      b.y += b.vy;

      // Did it hit the slime boss? That destroys it and wins the level.
      if (boss && rectsOverlap(b, boss)) {
        boss = null;
        thrownBombs.splice(i, 1);
        completeLevel();
        return;
      }

      // Did it reach a brick wall? If so, crumble it into falling bits.
      let hitWall = false;
      for (let j = platforms.length - 1; j >= 0; j--) {
        if (platforms[j].brick && rectsOverlap(b, platforms[j])) {
          crumbleWall(platforms[j]); // spawn tumbling brick pieces
          platforms.splice(j, 1);    // the wall stops blocking right away
          hitWall = true;
        }
      }

      if (hitWall) {
        thrownBombs.splice(i, 1);
      } else if (b.x < -20 || b.x > canvas.width + 20 || b.y > canvas.height + 20) {
        // Left the screen without hitting anything — give the bomb back
        // so the player can never get permanently stuck.
        player.bombs++;
        thrownBombs.splice(i, 1);
      }
    }

    // --- Crumbling wall bits: tumble down with gravity, then vanish ---
    for (let i = brickBits.length - 1; i >= 0; i--) {
      const bit = brickBits[i];
      bit.vy += GRAVITY;
      bit.x += bit.vx;
      bit.y += bit.vy;
      bit.spin += bit.vspin; // just for the drawing
      if (bit.y > canvas.height + 40) brickBits.splice(i, 1);
    }

    // The goal (if the level has one) counts as solid too.
    const solids = goal ? platforms.concat([goal]) : platforms.slice();

    // --- Horizontal movement, then stop at any wall we run into ---
    // We move on the X axis first and resolve side collisions separately
    // from vertical ones. Doing one axis at a time keeps the math simple.
    player.x += player.vx;
    for (const p of solids) {
      if (rectsOverlap(player, p)) {
        if (player.vx > 0) {
          player.x = p.x - player.width; // moving right: stop at its left side
        } else if (player.vx < 0) {
          player.x = p.x + p.width;      // moving left: stop at its right side
        }
      }
    }
    // Keep the player inside the left/right edges of the canvas.
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) {
      player.x = canvas.width - player.width;
    }

    // --- Vertical movement, then stop on floors and ceilings ---
    player.y += player.vy;
    player.onGround = false; // assume falling until we prove otherwise
    let reachedGoal = false;
    for (const p of solids) {
      if (rectsOverlap(player, p)) {
        if (player.vy > 0) {
          // Moving down: land on top of the platform.
          player.y = p.y - player.height;
          player.onGround = true;
          if (p === goal) reachedGoal = true; // we're standing on the flag!
          if (p.falls) p.triggered = true;    // stepping on it starts the drop
        } else if (player.vy < 0) {
          // Moving up: bonk our head, so we can't pass through from below.
          player.y = p.y + p.height;
        }
        player.vy = 0;
      }
    }

    // --- Fell in the lava (or off the bottom)? Restart this level. ---
    if ((lava && rectsOverlap(player, lava)) || player.y > canvas.height) {
      die();  // respawn — or, in hardcore mode, back to Level 1
      return; // we just respawned, so skip the rest of this frame
    }

    // --- Enemies pace back and forth, and are deadly to touch ---
    for (const e of enemies) {
      e.x += e.speed * e.dir; // walk in the current direction
      if (e.x <= e.minX) { e.x = e.minX; e.dir = 1; }  // hit left edge: turn right
      if (e.x + e.width >= e.maxX) {                    // hit right edge: turn left
        e.x = e.maxX - e.width;
        e.dir = -1;
      }
      if (rectsOverlap(player, e)) { // touched the alien?
        die();
        return;
      }
    }

    // --- The slime boss: deadly to touch, and it shoots slime balls ---
    if (boss) {
      if (rectsOverlap(player, boss)) { die(); return; } // touching it kills you
      // Fire a slime ball toward the player every so often.
      boss.shootTimer = (boss.shootTimer || 0) + 1;
      if (boss.shootTimer >= boss.shootInterval) {
        boss.shootTimer = 0;
        slimeBalls.push({
          x: boss.x - 16,
          y: boss.y + boss.height * 0.45,
          width: 16,
          height: 16,
          vx: -5, // flies left, toward where the player approaches from
        });
      }
    }

    // --- Slime balls fly across and kill the player on contact ---
    for (let i = slimeBalls.length - 1; i >= 0; i--) {
      const s = slimeBalls[i];
      s.x += s.vx;
      if (rectsOverlap(player, s)) { die(); return; }
      if (s.x < -20 || s.x > canvas.width + 20) slimeBalls.splice(i, 1);
    }

    // --- Pick up items (like bombs) by walking over them ---
    for (let i = items.length - 1; i >= 0; i--) {
      if (rectsOverlap(player, items[i])) {
        if (items[i].type === "bomb") player.bombs++;
        items.splice(i, 1); // it's collected, remove it from the level
      }
    }

    // --- Reached the goal? (i.e. we landed on the gold platform) ---
    if (reachedGoal) completeLevel();
  }

  // ============================================================
  //  DRAW — runs every frame to paint the picture
  // ============================================================
  function draw() {
    // Clear the previous frame.
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tick++; // move the lava animation along a little each frame

    // On the title screen, draw that instead of the game and stop here.
    if (onHomeScreen) {
      drawHomeScreen();
      return;
    }

    // Draw the lava first (behind everything), if this level has any.
    if (lava) drawLava(lava);

    // Draw platforms. A rickety (falling) platform looks exactly like a
    // normal one, so it's a hidden trap — it only jitters AFTER you step
    // on it, once it's already on its way down. A moving platform is teal
    // with a bright top, so players know they can ride it.
    for (const p of platforms) {
      const shakeX = p.falls && p.triggered ? Math.sin(tick * 1.5) * 2 : 0;
      if (p.brick) {
        drawBrickWall(p);
      } else if (p.move) {
        ctx.fillStyle = "#2a9d8f";
        ctx.fillRect(p.x + shakeX, p.y, p.width, p.height);
        ctx.fillStyle = "#8ee4d8"; // light top edge = "this is a machine"
        ctx.fillRect(p.x + shakeX, p.y, p.width, 3);
      } else {
        ctx.fillStyle = "#0f3460";
        ctx.fillRect(p.x + shakeX, p.y, p.width, p.height);
      }
    }

    // Draw tumbling brick pieces from a wall that just crumbled.
    for (const bit of brickBits) {
      ctx.save();
      ctx.translate(bit.x + bit.width / 2, bit.y + bit.height / 2);
      ctx.rotate(bit.spin);
      ctx.fillStyle = "#a8452f";
      ctx.fillRect(-bit.width / 2, -bit.height / 2, bit.width, bit.height);
      ctx.restore();
    }

    // Draw the goal (a gold block with a flag on a pole), if there is one.
    if (goal) drawGoal(goal);

    // Draw any walking enemies, and the slime boss + its slime balls.
    for (const e of enemies) drawEnemy(e);
    if (boss) drawBoss(boss);
    for (const s of slimeBalls) drawSlimeBall(s);

    // Draw bomb pickups sitting in the level, and any bombs in the air.
    for (const it of items) {
      if (it.type === "bomb") drawBomb(it.x + it.width / 2, it.y + it.height / 2, 9);
    }
    for (const b of thrownBombs) drawBomb(b.x + b.width / 2, b.y + b.height / 2, 8);

    // Draw the player from its pixel-art grid.
    drawPlayer();

    // Show how many bombs the player is carrying, in the top-right corner.
    if (player.bombs > 0) {
      drawBomb(canvas.width - 78, 24, 9);
      ctx.fillStyle = "#16213e";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("x " + player.bombs, canvas.width - 64, 30);
    }

    // Show which level we're on, up in the corner.
    ctx.fillStyle = "#16213e";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Level " + (currentLevel + 1), 16, 30);

    // Flag the hardcore modes right below so you can't forget the stakes.
    if (mode !== "normal") {
      ctx.fillStyle = "#c0392b";
      ctx.fillText(mode === "superhard" ? "SUPER HARDCORE" : "HARDCORE", 16, 52);
    }

    // If the game is won, cover the screen with a win message + button.
    if (gameWon) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 48px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("You Win! 🏆", canvas.width / 2, 180);

      // The clickable "Restart" button.
      const b = RESTART_BTN;
      ctx.fillStyle = "#e94560";
      ctx.fillRect(b.x, b.y, b.width, b.height);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.strokeRect(b.x, b.y, b.width, b.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 26px sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText("Restart", b.x + b.width / 2, b.y + b.height / 2 + 2);
      ctx.textBaseline = "alphabetic"; // reset so other text isn't affected
    }
  }

  // Draws the lava: a glowing pool with a gently rippling surface.
  function drawLava(l) {
    // The deep, molten body.
    ctx.fillStyle = "#c1290b";
    ctx.fillRect(l.x, l.y, l.width, l.height);

    // A rippling surface made of little blocks that bob up and down.
    // Math.sin makes a smooth wave; "tick" makes the wave move over time.
    const blockW = 20;
    for (let x = l.x; x < l.x + l.width; x += blockW) {
      const bob = Math.sin((x + tick * 2) / 30) * 3; // -3..+3 pixels
      ctx.fillStyle = "#ff7b29"; // bright orange glow
      ctx.fillRect(x, l.y + bob, blockW, 6);
      ctx.fillStyle = "#ffd34d"; // hottest yellow highlight on top
      ctx.fillRect(x, l.y + bob, blockW, 2);
    }
  }

  // Draws a pixel-art bomb centered at (cx, cy). r sets its size (the body
  // ends up about 2*r across), so all the existing callers still work.
  function drawBomb(cx, cy, r) {
    const pixel = r * 0.42; // size of one grid-pixel
    const boxW = BOMB_SPRITE[0].length * pixel;
    const boxH = BOMB_SPRITE.length * pixel;
    // Center the grid on (cx, cy).
    drawPixelSprite(BOMB_SPRITE, BOMB_COLORS, cx - boxW / 2, cy - boxH / 2, boxW, boxH);
  }

  // Draws a brick wall filling the box p, in a staggered brick pattern.
  function drawBrickWall(p) {
    ctx.fillStyle = "#5e271b"; // dark mortar shows between the bricks
    ctx.fillRect(p.x, p.y, p.width, p.height);
    ctx.fillStyle = "#a8452f"; // the bricks themselves
    const bw = 20, bh = 14, gap = 2;
    let row = 0;
    for (let y = p.y; y < p.y + p.height; y += bh) {
      const offset = row % 2 ? -bw / 2 : 0; // shift every other row
      for (let x = p.x + offset; x < p.x + p.width; x += bw) {
        // Keep each brick clipped inside the wall.
        const bx = Math.max(x, p.x);
        const bwidth = Math.min(x + bw - gap, p.x + p.width) - bx;
        const bheight = Math.min(y + bh - gap, p.y + p.height) - y;
        if (bwidth > 0 && bheight > 0) ctx.fillRect(bx, y, bwidth, bheight);
      }
      row++;
    }
  }

  // Break a brick wall into a grid of small pieces that pop and tumble away.
  function crumbleWall(w) {
    const size = 20;
    for (let y = w.y; y < w.y + w.height; y += size) {
      for (let x = w.x; x < w.x + w.width; x += size) {
        brickBits.push({
          x,
          y,
          width: Math.min(size - 2, w.x + w.width - x),
          height: Math.min(size - 2, w.y + w.height - y),
          vx: (Math.random() - 0.5) * 6, // fly left or right a bit
          vy: -Math.random() * 4 - 1,    // pop upward, then gravity takes over
          spin: 0,
          vspin: (Math.random() - 0.5) * 0.3, // tumble as it falls
        });
      }
    }
  }

  // Draws the purple alien from its pixel grid, mirrored to face the way
  // it's walking (so its eyes look in the direction it moves).
  function drawEnemy(e) {
    const faceLeft = e.dir < 0;
    drawPixelSprite(ENEMY_SPRITE, ENEMY_COLORS, e.x, e.y, e.width, e.height, faceLeft);
  }

  // Draws the slime boss from its pixel grid, with a gentle wobble.
  function drawBoss(bo) {
    const wobble = Math.sin(tick * 0.1) * 2; // squishy side-to-side sway
    drawPixelSprite(SLIME_SPRITE, SLIME_COLORS, bo.x + wobble, bo.y, bo.width, bo.height);
  }

  // Draws a slime ball from its little pixel grid.
  function drawSlimeBall(s) {
    drawPixelSprite(SLIMEBALL_SPRITE, SLIMEBALL_COLORS, s.x, s.y, s.width, s.height);
  }

  // Draws a goal: a gold platform with a pixel-art flag standing on it.
  function drawGoal(g) {
    // The gold platform you stand on.
    ctx.fillStyle = "#ffd700";
    ctx.fillRect(g.x, g.y, g.width, g.height);

    // The flag (pole + pennant), drawn as pixels so it matches the blocky
    // style of the characters. Each grid pixel is PIXEL screen-pixels big.
    const PIXEL = 4;
    const boxW = FLAG_SPRITE[0].length * PIXEL;
    const boxH = FLAG_SPRITE.length * PIXEL;
    const x = g.x + g.width / 2; // pole sits at the middle of the platform
    const y = g.y - boxH;        // and rises up from its top
    drawPixelSprite(FLAG_SPRITE, FLAG_COLORS, x, y, boxW, boxH);
  }

  // Paints a pixel-art grid (a list of letter-rows) into the box x,y,w,h.
  // Each letter is looked up in `colors`; "." or unknown letters draw
  // nothing. Set flip=true to mirror it left-right. Used for the player
  // AND the enemy, so we only write this pixel-drawing loop once.
  function drawPixelSprite(grid, colors, x, y, w, h, flip = false) {
    const rows = grid.length;
    const cols = grid[0].length;
    const pixelW = w / cols; // size of one grid-pixel
    const pixelH = h / rows;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const color = colors[grid[row][col]];
        if (!color) continue;

        const drawCol = flip ? cols - 1 - col : col; // mirror if flipped
        ctx.fillStyle = color;
        // Rounding sizes up avoids thin gaps between pixels.
        ctx.fillRect(
          x + drawCol * pixelW,
          y + row * pixelH,
          Math.ceil(pixelW),
          Math.ceil(pixelH)
        );
      }
    }
  }

  // Draws the player character from its pixel grid.
  function drawPlayer() {
    // On the ground the spring is coiled; in the air it uncoils and we
    // draw the alien taller so the spring boings out below his feet.
    const inAir = !player.onGround;
    const sprite = inAir ? SPRITE_STRETCHED : SPRITE_COILED;
    const drawHeight = player.height * (inAir ? 1.3 : 1);
    drawPixelSprite(sprite, SPRITE_COLORS, player.x, player.y, player.width, drawHeight);
  }

  // Draws the title / home screen: the game name, the alien, and a Start
  // button. Shown until the player clicks Start.
  function drawHomeScreen() {
    // Sky background with a ground strip along the bottom.
    ctx.fillStyle = "#87ceeb";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0f3460";
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

    // The alien, drawn near the top (small, to leave room for buttons).
    drawPixelSprite(SPRITE_COILED, SPRITE_COLORS, canvas.width / 2 - 28, 106, 56, 84);

    // The title, with a little dark shadow behind it so it pops.
    ctx.textAlign = "center";
    ctx.font = "bold 52px sans-serif";
    ctx.fillStyle = "#16213e";
    ctx.fillText("SPRING ALIEN", canvas.width / 2 + 3, 88);
    ctx.fillStyle = "#ffd700";
    ctx.fillText("SPRING ALIEN", canvas.width / 2, 85);

    // Three ways to play, plus a button to wipe all the best times.
    drawButton(START_BTN, "Start", "#e94560");
    drawButton(HARDCORE_BTN, "Hardcore", "#7a1f2b");
    drawButton(SUPER_BTN, "Super Hardcore", "#4a0e1a");
    drawButton(RESET_SCORE_BTN, "Reset High Score", "#2a6f97");
  }

  // Draws a labeled button rectangle (bg color) with a white outline.
  function drawButton(b, label, bg) {
    ctx.fillStyle = bg;
    ctx.fillRect(b.x, b.y, b.width, b.height);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.strokeRect(b.x, b.y, b.width, b.height);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, b.x + b.width / 2, b.y + b.height / 2 + 1);
    ctx.textBaseline = "alphabetic"; // reset so other text isn't affected
  }

  // ============================================================
  //  THE TIMER
  // ============================================================
  // Turn a number of milliseconds into a "M:SS" string.
  function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return minutes + ":" + String(seconds).padStart(2, "0");
  }
  // Start (or resume) counting from where we left off.
  function startTimer() {
    if (!timerRunning) {
      // Line up startTime so that (now - startTime) equals the time so far.
      startTime = performance.now() - elapsedMs;
      timerRunning = true;
    }
  }
  // Reset back to 0 and leave it PAUSED, waiting for the Start button.
  function restartTimer() {
    elapsedMs = 0;
    timerRunning = false;
  }
  // Read/write the best time from the browser's storage. Wrapped in
  // try/catch because some browsers block storage when opened as a file.
  function loadBest(key) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? Number(v) : null;
    } catch (e) {
      return null;
    }
  }
  function saveBest(key, ms) {
    try {
      localStorage.setItem(key, String(Math.round(ms)));
    } catch (e) {
      /* storage not available — the best time just won't persist */
    }
  }

  // Update the on-screen timer text each frame. While running (and not yet
  // won), we recompute the elapsed time; otherwise it stays frozen.
  function updateTimer() {
    if (timerRunning && !gameWon) {
      elapsedMs = performance.now() - startTime;
    }
    timerEl.textContent = "Time: " + formatTime(elapsedMs);

    // The frame we FIRST win, check for a new best time (only if the timer
    // was actually running). Each mode keeps its own separate record.
    if (gameWon && !prevGameWon && timerRunning) {
      const best = currentBest();
      if (best === null || elapsedMs < best) setCurrentBest(elapsedMs);
    }
    prevGameWon = gameWon;

    // Show the best time for whichever mode we're in, clearly labeled.
    const labels = {
      normal: "Best: ",
      hard: "Best (Hardcore): ",
      superhard: "Best (Super Hardcore): ",
    };
    const best = currentBest();
    bestEl.textContent = labels[mode] + (best === null ? "--" : formatTime(best));
  }

  // Read/update the best time for whichever mode we're currently playing.
  function currentBest() {
    if (mode === "superhard") return bestSuperMs;
    if (mode === "hard") return bestHardMs;
    return bestNormalMs;
  }
  function setCurrentBest(ms) {
    if (mode === "superhard") { bestSuperMs = ms; saveBest("bestTimeSuperMs_v2", ms); }
    else if (mode === "hard") { bestHardMs = ms; saveBest("bestTimeHardMs_v2", ms); }
    else { bestNormalMs = ms; saveBest("bestTimeMs_v2", ms); }
  }
  // Wipe every mode's best time (memory + saved storage) back to "--".
  function resetHighScores() {
    bestNormalMs = null;
    bestHardMs = null;
    bestSuperMs = null;
    try {
      localStorage.removeItem("bestTimeMs_v2");
      localStorage.removeItem("bestTimeHardMs_v2");
      localStorage.removeItem("bestTimeSuperMs_v2");
    } catch (e) {
      /* storage not available — nothing was saved anyway */
    }
  }

  // Wire the Restart button — it resets the ENTIRE game (back to Level 1)
  // and the timer. The timer itself starts as soon as the player moves.
  document.getElementById("restartBtn").addEventListener("click", restartGame);

  // ============================================================
  //  THE GAME LOOP
  // ============================================================
  // This runs update + draw about 60 times per second, forever.
  function gameLoop() {
    update();
    draw();
    updateTimer();
    requestAnimationFrame(gameLoop);
  }
  gameLoop();
  </script>
</body>
</html>
